name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Must be a Node that ships npm 11.x: package-lock.json is written by
          # npm 11 locally, and npm 10 (Node 20/22) resolves a different tree,
          # which makes `npm ci` fail on missing @emnapi packages. Node 24 also
          # satisfies the >=22.12 engine requirement of the Sanity toolchain.
          node-version: 24
          cache: npm

      - name: Install dependencies
        # `npm install`, not `npm ci`: the @emnapi/* wasm packages under sharp
        # and tailwind's oxide binding are platform-gated optional deps, and npm
        # cannot record a lockfile on macOS that satisfies `npm ci` on linux
        # (it fails there on missing @emnapi/core, and locally on a mismatched
        # @emnapi/wasi-threads). package-lock.json is still committed and still
        # pins resolutions; install just tolerates the platform gap.
        run: npm install --no-audit --no-fund

      - name: Build
        env:
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
          NEXT_PUBLIC_SANITY_API_VERSION: ${{ secrets.NEXT_PUBLIC_SANITY_API_VERSION }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
